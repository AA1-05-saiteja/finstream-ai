name: FinStream AI — Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test Suite (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Model Artifacts
        run: |
          python -c "
          import os
          required = [
              'models/artifacts/xgboost_model.joblib',
              'models/artifacts/isolation_forest.joblib',
              'models/artifacts/feature_columns.json'
          ]
          missing = [f for f in required if not os.path.exists(f)]
          if missing:
              raise FileNotFoundError(f'Missing required ML artifacts: {missing}')
          print('All required ML artifacts present.')
          "

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v
