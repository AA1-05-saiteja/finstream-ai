version: "3.8"

services:
  # =========================================================================
  # Apache Kafka (Single-Node KRaft Mode)
  # =========================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: finstream-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # KRaft cluster configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Kafka UI (Web dashboard for visual topic inspection)
  # =========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: finstream-kafka-ui
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: finstream-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # =========================================================================
  # PostgreSQL (Persistent Transaction & Risk Assessment Storage)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: finstream-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finstream_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finstream_password}
      POSTGRES_DB: ${POSTGRES_DB:-finstream_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-finstream_user} -d $${POSTGRES_DB:-finstream_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Redis (Hot State & In-Memory Recent Risk Store)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: finstream-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # FastAPI REST & WebSocket Backend API
  # =========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finstream-api
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-finstream_db}
      - POSTGRES_USER=${POSTGRES_USER:-finstream_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-finstream_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================================================================
  # React + TypeScript Web Dashboard
  # =========================================================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000/api/v1
        - VITE_WS_URL=ws://localhost:8000/api/v1/ws/transactions
    container_name: finstream-dashboard
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  kafka_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

